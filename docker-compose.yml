services:
  jekyll:
    image: amirpourmand/al-folio:latest
    working_dir: /srv/jekyll
    command: bash -c "bundle install --jobs 4 --retry 3 && bundle exec jekyll serve --config _config.yml,_config.local.yml --host 0.0.0.0 --port 8080 --force_polling --destination /tmp/portfolio-site"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/srv/jekyll
    environment:
      JEKYLL_ENV: development
